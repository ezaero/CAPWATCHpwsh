# Current DLOpsQuals distribution lists.
# CAPGroups now maintains CAP-OpsQual-* Entra security source groups, including
# exact per-achievement groups named from Achievements.txt. These distribution
# list definitions stay disabled until each list is intentionally migrated away
# from the legacy DLOpsQuals updater.
distributionLists:
  - displayName: "Pilots"
    email: "Pilots@cowg.cap.gov"
    enabled: false
    ensureGroup: true
    source: "DLOpsQuals"
    criteria: "MbrTasks TaskID 69 ACTIVE"
    includeGroups:
      - "CAP-OpsQual-Pilot"
    excludeGroups: []
  - displayName: "KAPA Pilot List"
    email: "KAPAPilotList@cowg.cap.gov"
    enabled: false
    ensureGroup: true
    source: "DLOpsQuals"
    criteria: "MbrTasks TaskID 69 ACTIVE, limited to KAPA_UNIT_CODES plus manual CAPIDs"
    includeGroups:
      - "CAP-OpsQual-KAPA-Pilot"
    excludeGroups: []
  - displayName: "ESList"
    email: "ESList@cowg.cap.gov"
    enabled: false
    ensureGroup: true
